name: release

# Builds installable release bundles on every push/merge to `main` and
# publishes them as a GitHub **release** (official stable release).
# The git tag is created automatically from the version in pubspec.yaml.
#
#   Linux   (x64)   built on ubuntu
#   Android (APK)   built on ubuntu (universal fat APK + per-arch AAB)
#   Windows (x64)   built on windows-latest (portable zip + setup.exe installer)
#
# The in-app OTA updater fetches `releases/latest` from the GitHub API
# (no static manifest JSON files are generated or committed).
#
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: linux android
          - os: windows-latest
            targets: windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Provision the Android release keystore from GitHub secrets so the
      # release APKs are signed with the SAME stable key as local builds.
      # Without this both CI and local release builds would fall back to the
      # debug keystore, and a debug-signed APK cannot be installed over a
      # release-signed one (signature mismatch → INSTALL_FAILED_UPDATE_INCOMPATIBLE).
      # Configure these secrets in the repo settings:
      #   BREWLINE_KEYSTORE_BASE64  = base64 of the brewline.jks keystore file
      #   BREWLINE_KEYSTORE_PASSWORD
      #   BREWLINE_KEY_ALIAS
      #   BREWLINE_KEY_PASSWORD
      - name: Provision Android release keystore
        if: runner.os == 'Linux'
        env:
          BREWLINE_KEYSTORE_BASE64: ${{ secrets.BREWLINE_KEYSTORE_BASE64 }}
          BREWLINE_KEYSTORE_PASSWORD: ${{ secrets.BREWLINE_KEYSTORE_PASSWORD }}
          BREWLINE_KEY_ALIAS: ${{ secrets.BREWLINE_KEY_ALIAS }}
          BREWLINE_KEY_PASSWORD: ${{ secrets.BREWLINE_KEY_PASSWORD }}
        run: |
          if [ -z "$BREWLINE_KEYSTORE_BASE64" ]; then
            echo "::warning::No release keystore configured — building with debug signing."
            exit 0
          fi
          # Decode the keystore under android/app so Gradle's relative
          # `file()` (resolved from the app module dir) can find it.
          mkdir -p android/app/keystores
          printf '%s' "$BREWLINE_KEYSTORE_BASE64" | base64 -d > android/app/keystores/brewline.jks
          # Write the key.properties Gradle reads. storeFile is relative to the
          # android/app/ project dir (where build.gradle.kts calls file()).
          cat > android/key.properties <<EOF
          storePassword=${BREWLINE_KEYSTORE_PASSWORD}
          keyPassword=${BREWLINE_KEY_PASSWORD}
          keyAlias=${BREWLINE_KEY_ALIAS}
          storeFile=keystores/brewline.jks
          EOF
          # Verify the alias matches so a misconfigured keystore fails early.
          keytool -keystore android/app/keystores/brewline.jks -list \
            -storepass "${BREWLINE_KEYSTORE_PASSWORD}" \
            -alias "${BREWLINE_KEY_ALIAS}" >/dev/null

      # The ubuntu runner needs GTK3 + friends to build the Linux desktop
      # target (these aren't preinstalled on the GitHub-hosted ubuntu image).
      - name: Install Linux desktop build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev

      # Cache pub dependencies so `flutter pub get` (and the Flutter build)
      # don't re-resolve packages on every run.
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            .dart_tool
            .flutter-plugins-dependencies
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      # Cache Gradle (Android) build state for the ubuntu runner — the
      # heaviest part of the Android build after the first run.
      - name: Cache Gradle
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ github.workspace }}/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Inno Setup 6 compiles the Windows installer (setup.exe) from the
      # freshly built release bundle. It's installed silently so build.sh can
      # find ISCC on the default install path. The portable zip stays in the
      # release too — the in-app OTA updater downloads `brewline-windows-x64.zip`
      # by name (see lib/core/updates/github_release.dart), so it must remain.
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup --accept-source-agreements --accept-package-agreements

      # Builds each requested target. On Windows, verbose output is captured to
      # a log file so the underlying error (GitHub truncates collapsed output)
      # is preserved and echoed if the build fails.
      - name: Build release bundles
        shell: bash
        env:
          CI: "true"
          GITHUB_SHA: ${{ github.sha }}
        run: |
          chmod +x ./build.sh
          for target in ${{ matrix.targets }}; do
            echo "::group::Build $target"
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              set +e
              ./build.sh -v --only "$target" --no-version-checksum 2>&1 | tee /tmp/${target}-build.log
              rc=${PIPESTATUS[0]}
              set -e
              if (( rc != 0 )); then
                echo "::error::Build of '$target' failed (exit $rc). Last 120 log lines:"
                tail -n 120 /tmp/${target}-build.log
                exit $rc
              fi
            else
              ./build.sh --only "$target" --no-version-checksum
            fi
            echo "::endgroup::"
          done

      # DEBUG ONLY: reproduce the flutter assemble step directly so the real
      # error (which MSBuild's custom-build handler swallows, yielding only
      # MSB8066) is visible. Runs when a previous step failed on Windows.
      - name: Debug assemble (Windows)
        if: failure() && runner.os == 'Windows'
        shell: bash
        run: |
          flutter assemble --no-version-check \
            --output=build \
            -dTargetPlatform=windows-x64 \
            -dTrackWidgetCreation=false \
            -dBuildMode=release \
            -dTargetFile=lib/main.dart \
            -dTreeShakeIcons=true \
            -dDartObfuscation=false \
            release_bundle_windows-x64_assets

      # Linux bundle: the whole build/linux/x64/release/bundle/ directory,
      # archived next to the upload glob (build/linux/x64/release/*.tar.gz).
      #
      # MUST archive the ENTIRE bundle directory — NOT a hand-picked subset of
      # files. `sqflite_common_ffi` loads the native sqlite3 library (bundled
      # via sqlite3_flutter_libs build output) over dart:ffi, and a packaging
      # step that drops it silently reintroduces the desktop launch crash
      # (error code 126 / sqlite3_initialize). See improve.md.
      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -czf build/linux/x64/release/brewline-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      # Windows: package the runner Release output with PowerShell (7z is not
      # guaranteed to be on PATH).
      #
      # MUST archive the ENTIRE Release/ directory — NOT a hand-picked subset
      # of files. `sqflite_common_ffi` loads the native sqlite3 library
      # (bundled via sqlite3_flutter_libs build output) over dart:ffi, and a
      # packaging step that drops it silently reintroduces the desktop launch
      # crash (error code 126 / sqlite3_initialize). See improve.md.
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/windows/x64/runner/brewline-windows-x64.zip -Force

      # Stage every build output into a flat dist/ directory. upload-artifact v4
      # stores files relative to the common ancestor of the matched paths, which
      # would preserve the nested build/... structure and break the release
      # job's flat globs. Flattening here keeps all files at the top level.
      - name: Stage release artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/*.apk dist/ 2>/dev/null || true
          cp build/app/outputs/bundle/release/*.aab dist/ 2>/dev/null || true
          cp build/linux/x64/release/*.tar.gz dist/ 2>/dev/null || true
          cp build/windows/x64/runner/*.zip dist/ 2>/dev/null || true
          cp build/windows/x64/installer/*.exe dist/ 2>/dev/null || true
          echo "Staged files:"; ls -1 dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brewline-${{ matrix.os }}-${{ github.sha }}
          if-no-files-found: error
          path: dist/*

  # Aggregates every artifact from the build matrix into a single GitHub
  # release, tagged as the app version.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -nE 's/^version: *([^ ]+).*/\1/p' pubspec.yaml | head -n1)"
          TAG="${VERSION%%+*}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Collision-safe: delete any existing tag/ref from a prior run of the
          # same version so re-merges into main can re-release that version.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          else
            git tag -d "$TAG" >/dev/null 2>&1 || true
          fi

          # Create and push the version tag derived from pubspec.yaml.
          git tag "$TAG"
          git push origin "$TAG"

          # Strip the YAML-indentation whitespace and extract ONLY the
          # `## [<version>]` section from CHANGELOG.md (not everything from the
          # first heading). Reference-link lines (`[name]: url`) are dropped too.
          sed -n "/^## \\[$TAG\\]/,/^## \\[/p" CHANGELOG.md \
            | sed '$d' \
            | sed -E '/^[[:space:]]*\[[^]]+\]:[[:space:]]/d' \
            | sed 's/^[[:space:]]*//' \
            > /tmp/release_notes.md

          # Collect the downloaded artifacts into an array with nullglob so an
          # unmatched pattern expands to nothing (instead of being passed to gh
          # as a literal glob, which otherwise fails the run).
          shopt -s nullglob
          artifacts=(artifacts/*.tar.gz artifacts/*.zip artifacts/*.apk artifacts/*.aab artifacts/*.exe)
          if (( ${#artifacts[@]} == 0 )); then
            echo "::error::No build artifacts found under artifacts/"; exit 1
          fi

          gh release create "$TAG" \
            --title "brewline $VERSION" \
            --notes-file /tmp/release_notes.md \
            "${artifacts[@]}"